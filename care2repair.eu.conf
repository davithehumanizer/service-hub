# Redirect www to non-www (HTTP)
<VirtualHost *:80>
    ServerName www.care2repair.eu
    Redirect permanent / http://care2repair.eu/
</VirtualHost>

# Redirect www to non-www (HTTPS)
<VirtualHost *:443>
    ServerName www.care2repair.eu

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/care2repair.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/care2repair.eu/privkey.pem

    Redirect permanent / https://care2repair.eu/
</VirtualHost>

<VirtualHost *:443>
    ServerName care2repair.eu

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/care2repair.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/care2repair.eu/privkey.pem

    # Maintenance page, served by Apache itself so it shows while the
    # containers are down. The deploy workflow creates ON before stopping them
    # and removes it once the models are assigned; by hand, `touch` and `rm`
    # are enough, no reload. Apache (www-data) must be able to read the folder,
    # or -f stays false and the page never shows. Without ON, it still answers
    # a 503 Apache raises itself (a container not answering); a 503 sent by
    # the API passes through untouched — never set ProxyErrorOverride On.
    Alias "/maintenance.html" "/opt/care2repair/deployment/maintenance/maintenance.html"
    <Directory "/opt/care2repair/deployment/maintenance">
        Require all granted
    </Directory>
    ProxyPass "/maintenance.html" "!"
    ErrorDocument 503 /maintenance.html

    RewriteEngine On
    RewriteCond "/opt/care2repair/deployment/maintenance/ON" -f
    RewriteCond %{REQUEST_URI} !^/maintenance\.html$
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    # To check the site before reopening it, let one address through:
    # RewriteCond %{REMOTE_ADDR} !=203.0.113.10
    RewriteRule ^ - [R=503,L]
    Header always set Retry-After "3600" "expr=%{REQUEST_STATUS} == 503 && %{REQUEST_URI} == '/maintenance.html'"

    # API Gateway reverse proxy sous /api
    ProxyPass "/api/" "http://localhost:3000/api/"
    ProxyPassReverse "/api/" "http://localhost:3000/api/"

    # --- AJOUT : Proxy Kibana ---
    ProxyPass "/kibana/" "http://localhost:5601/kibana/"
    ProxyPassReverse "/kibana/" "http://localhost:5601/kibana/"

    <Location "/kibana/">
        AuthType Basic
        AuthName "Restricted Access"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user

        # Pour les cookies
        ProxyPassReverseCookiePath / /kibana/
    </Location>

    # OIDC well-known endpoints (must come before the frontend catch-all).
    # The Location wrapper carries the CORS header: discovery and JWKS are read
    # cross-origin by browser-side OAuth clients, which fail without it. This
    # was fixed directly on the server and had drifted out of this file — do not
    # collapse it back into a bare ProxyPass.
    <Location "/.well-known/">
        ProxyPass "http://localhost:3000/.well-known/"
        ProxyPassReverse "http://localhost:3000/.well-known/"
        Header set Access-Control-Allow-Origin: "*"
    </Location>

    # Frontend React
    ProxyPreserveHost On
    ProxyPass "/" "http://localhost:3010/"
    ProxyPassReverse "/" "http://localhost:3010/"
    

    # Important pour websockets, si API en a besoin
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /api/(.*) ws://localhost:3000/$1 [P,L]

    #

    # Headers proxy
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

</VirtualHost>

# ── spareparts.care2repair.eu ─────────────────────────────────────────────────
#
# The application routes by subdomain: every route it declares is bound to
# www., data., repairer., manufacturer., admin. or api. Nothing answers on the
# bare name, which is why it gets its own redirect below rather than an alias.
#
# All these names live on the care2repair.eu certificate lineage — there is no
# separate spareparts certificate. Adding a name means re-running certbot with
# the *complete* -d list, since it replaces rather than extends:
#   sudo certbot certonly --apache --cert-name care2repair.eu \
#     -d care2repair.eu -d www.care2repair.eu \
#     -d spareparts.care2repair.eu -d storage.care2repair.eu \
#     -d www.spareparts.care2repair.eu -d data.spareparts.care2repair.eu \
#     -d repairer.spareparts.care2repair.eu -d manufacturer.spareparts.care2repair.eu \
#     -d admin.spareparts.care2repair.eu -d api.spareparts.care2repair.eu

# HTTP → HTTPS redirect
<VirtualHost *:80>
    ServerName spareparts.care2repair.eu
    ServerAlias www.spareparts.care2repair.eu
    ServerAlias data.spareparts.care2repair.eu
    ServerAlias repairer.spareparts.care2repair.eu
    ServerAlias manufacturer.spareparts.care2repair.eu
    ServerAlias admin.spareparts.care2repair.eu
    ServerAlias api.spareparts.care2repair.eu

    # Preserve the requested host instead of collapsing every subdomain onto the
    # bare name, and leave the ACME path alone so an HTTP-01 renewal still works
    # if certbot is ever run with the webroot plugin instead of --apache.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

# The bare name matches no route in the application: send it to the catalogue.
<VirtualHost *:443>
    ServerName spareparts.care2repair.eu

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/care2repair.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/care2repair.eu/privkey.pem

    Redirect permanent / https://data.spareparts.care2repair.eu/
</VirtualHost>

# The application itself. One vhost for every subdomain: Symfony does the host
# routing, Apache only has to hand it the original Host header.
<VirtualHost *:443>
    ServerName www.spareparts.care2repair.eu
    ServerAlias data.spareparts.care2repair.eu
    ServerAlias repairer.spareparts.care2repair.eu
    ServerAlias manufacturer.spareparts.care2repair.eu
    ServerAlias admin.spareparts.care2repair.eu
    ServerAlias api.spareparts.care2repair.eu

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/care2repair.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/care2repair.eu/privkey.pem

    # ProxyPreserveHost is what makes the subdomain routing work at all: without
    # it Apache would send Host: localhost and no route would match.
    ProxyPreserveHost On
    ProxyPass "/" "http://localhost:8080/"
    ProxyPassReverse "/" "http://localhost:8080/"

    # Symfony only reads these because framework.trusted_proxies is set; without
    # that it would ignore them and build every absolute URL as http://.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ErrorLog ${APACHE_LOG_DIR}/spareparts_error.log
    CustomLog ${APACHE_LOG_DIR}/spareparts_access.log combined
</VirtualHost>

# ── storage.care2repair.eu — shared MinIO (/opt/platform) ────────────────────

<VirtualHost *:80>
    ServerName storage.care2repair.eu
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName storage.care2repair.eu

    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/care2repair.eu/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/care2repair.eu/privkey.pem

    # Not optional here: presigned URLs are signed over the Host header, so
    # rewriting it invalidates every signature MinIO is asked to verify.
    ProxyPreserveHost On
    ProxyPass "/" "http://localhost:9000/"
    ProxyPassReverse "/" "http://localhost:9000/"

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Object uploads are slower than page requests; the 60s default cuts large
    # media off mid-transfer.
    ProxyTimeout 300

    ErrorLog ${APACHE_LOG_DIR}/storage_error.log
    CustomLog ${APACHE_LOG_DIR}/storage_access.log combined
</VirtualHost>
