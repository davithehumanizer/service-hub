# Security headers for the SPA, included in every location block.
#
# `always` so they are emitted on error responses too. See nginx.conf for why
# this is an include rather than a single declaration at server level.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;

# CRA inlines a bootstrap script and Leaflet/Mantine inject styles, hence
# 'unsafe-inline'. google.com/gstatic.com cover reCAPTCHA. connect-src stays
# broad because the app talks to the API, Nominatim and OSM tile servers.
#
# fonts.googleapis.com (stylesheets) and fonts.gstatic.com (font files) are
# required: index.html loads Inter, Noto Sans, Spline Sans and — critically —
# Material Symbols Outlined from there. Omitting them renders every icon in the
# UI as its raw ligature text.
#
# 'wasm-unsafe-eval' lets the barcode scanner compile its WebAssembly. Without
# it Chrome refuses the module outright and the scanner reads nothing, with no
# visible failure. It permits WebAssembly only — not eval().
#
# http://localhost:* is required for local development only. In production the
# API is same-origin — Apache proxies /api/ under care2repair.eu, so 'self'
# covers it — but locally the app is served from :3010 and calls the gateway on
# :3000 over plain HTTP, which is neither 'self' nor https:. It appears in
# connect-src (API calls) and img-src (uploads served from /api/uploads).
# Allowing it in production costs nothing: it can only ever reach the visitor's
# own machine, and browsers gate that separately via Private Network Access.
#
# The Retorik assistant needs four things the policy did not grant. Each failed
# silently apart from the console, and each is required for the agent to run:
#
#  - media-src was never declared, so it fell back to default-src 'self' and
#    blocked the framework's interface sounds on cdn.retorik.ai as well as the
#    blob: audio the speech synthesis produces.
#  - worker-src was never declared either, so it fell back to script-src and
#    blocked the body engine's workers, which it creates from blob: URLs.
#  - connect-src allowed https: but not blob:, and the 3D character's textures
#    are fetched from blob: URLs by the glTF loader.
#  - connect-src's https: does not cover wss: — a CSP scheme source matches its
#    own scheme only — so the conversation's WebSocket needs it spelled out.
#
# blob: here is same-origin data the page itself created, and media-src https:
# matches what img-src and connect-src already allow.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: http://localhost:*; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: data: https:; worker-src 'self' blob:; connect-src 'self' blob: https: wss: http://localhost:*; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
