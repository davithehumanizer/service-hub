server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # nginx does not merge add_header directives across levels: as soon as a
    # location block declares one, every add_header inherited from the server
    # block is dropped. The three cache-control locations below therefore have
    # to repeat these, which is why they live in an include rather than being
    # written once here.
    #
    # HSTS comes from Apache, which terminates TLS in front of this container.
    include /etc/nginx/snippets/security-headers.conf;

    # SPA fallback: redirect all unknown routes to index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for the main HTML entry (always fetch latest)
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Never cache locale/translation files (updated without filename change)
    location ~* /locales/.*\.json$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # Cache static assets aggressively (hashed filenames by CRA)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }
}
