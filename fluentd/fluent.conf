<system>
  log_level debug
</system>

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<match api-gateway.**>
  @type elasticsearch
  @id out_es
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix api-gateway
  include_timestamp true
  include_tag_key true
  time_key timestamp
  time_key_format %Y-%m-%dT%H:%M:%S.%N%z

  <buffer tag,time>
    @type memory
    flush_mode interval
    flush_interval 10s
    retry_max_interval 30
    retry_forever true
    timekey 1m
    timekey_wait 30s
    timekey_use_utc true
  </buffer>
</match>

<match repair-monitor.**>
  @type elasticsearch
  @id out_es_repair_monitor
  host elasticsearch
  port 9200
  scheme http
  logstash_format true
  logstash_prefix repair-monitor
  include_timestamp true
  include_tag_key true
  time_key timestamp
  time_key_format %Y-%m-%dT%H:%M:%S.%N%z

  <buffer tag,time>
    @type memory
    flush_mode interval
    flush_interval 10s
    retry_max_interval 30
    retry_forever true
    timekey 1m
    timekey_wait 30s
    timekey_use_utc true
  </buffer>
</match>


<match **>
  @type stdout
</match>
