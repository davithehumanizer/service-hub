volumes:
  postgres_data:
  # localstack_data:
  uploads_data:

networks:
  logging-network:
    name: logging-network
    driver: bridge

  # Shared with spareparts_symfony and with the MinIO stack in /opt/platform,
  # which owns it and must therefore be up first. Being external, a missing
  # network makes `up` refuse to start this entire stack — not just
  # spare-parts-service — so an ordering mistake here takes care2repair.eu down
  # with it.
  platform-network:
    external: true
    name: platform-network
